<svg width="1200" height="520" viewBox="0 0 1200 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">PrivateSearch — Search without being followed</title>
<desc id="desc">Editorial hero: desk with index cards, magnifier, warm paper</desc>
<rect width="1200" height="520" rx="16" fill="#FDF8F0"/>
<!-- grain -->
<rect width="1200" height="520" rx="16" fill="url(#g)" opacity="0.06"/>
<defs>
  <filter id="n"><feTurbulence baseFrequency="0.85" numOctaves="3"/><feColorMatrix values="0 0 0 0 0.9 0 0 0 0 0.7 0 0 0 0 0.5 0 0 0 0.15 0"/></filter>
  <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#E8DDD0"/><stop offset="100%" stop-color="#FDF8F0"/></linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0 H0 V32" fill="none" stroke="#E8DDD0" stroke-opacity="0.35" stroke-width="0.7"/></pattern>
</defs>
<!-- marginal red line -->
<line x1="64" y1="0" x2="64" y2="520" stroke="#C9320A" stroke-opacity="0.18" stroke-width="1"/>
<!-- top rule -->
<line x1="64" y1="52" x2="1136" y2="52" stroke="#1A1816" stroke-width="1.3"/>
<text x="64" y="30" font-family="JetBrains Mono, monospace" font-size="9" letter-spacing="3" fill="#8D857B">PS — 01  ·  EST. 2024  ·  PRIVATE INDEX</text>
<text x="1136" y="30" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="9" letter-spacing="1.5" fill="#8D857B">SELF-HOSTED / NO. 008</text>

<!-- left copy -->
<text x="84" y="108" font-family="Fraunces, Georgia, serif" font-size="54" letter-spacing="-2.2" fill="#1A1816">Search without</text>
<text x="84" y="162" font-family="Fraunces, Georgia, serif" font-size="54" font-style="italic" font-weight="700" letter-spacing="-2.2" fill="#1A1816">being followed.</text>
<rect x="84" y="172" width="260" height="10" rx="2" fill="#FFE9A8" opacity="0.9"/>
<text x="84" y="162" font-family="Fraunces, Georgia, serif" font-size="54" font-style="italic" font-weight="700" letter-spacing="-2.2" fill="#1A1816">being followed.</text>
<text x="84" y="200" font-family="Newsreader, Georgia, serif" font-size="15" fill="#3A3632">Your queries stay on <tspan font-weight="600" fill="#1A1816">your machine</tspan>. No ads, no profile, no third party.</text>
<text x="84" y="220" font-family="Newsreader, Georgia, serif" font-size="15" fill="#3A3632">Just the web you chose to keep.</text>

<!-- search slip mock -->
<g transform="translate(84,248) rotate(-0.4)">
  <rect width="560" height="56" rx="6" fill="#FFFFFF" stroke="#DDD1BE" stroke-width="1.2"/>
  <rect x="2" y="2" width="560" height="56" rx="6" fill="none" stroke="#1A1816" stroke-opacity="0.04"/>
  <circle cx="28" cy="28" r="3.5" fill="#C9320A"/>
  <text x="44" y="32" font-family="JetBrains Mono, monospace" font-size="12" fill="#B8B0A3" font-style="italic">Ask your index anything — try “youtube music”</text>
  <rect x="452" y="8" width="98" height="40" rx="4" fill="#1A1816"/>
  <text x="501" y="32" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#FDF8F0" letter-spacing="0.8">SEARCH →</text>
</g>
<!-- meta -->
<text x="84" y="330" font-family="JetBrains Mono, monospace" font-size="10" letter-spacing="1" fill="#8D857B">21 PAGES · 200 TERMS — BM25 + HYBRID — NO TRACKING</text>
<!-- pills -->
<g transform="translate(84,344)">
  <rect width="72" height="24" rx="12" fill="#F7EFE2" stroke="#E8DDD0"/><text x="36" y="16" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" fill="#3A3632">youtube</text>
  <g transform="translate(80,0)"><rect width="118" height="24" rx="12" fill="#F7EFE2" stroke="#E8DDD0"/><text x="59" y="16" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" fill="#3A3632">machine learning</text></g>
  <g transform="translate(206,0)"><rect width="84" height="24" rx="12" fill="#F7EFE2" stroke="#E8DDD0"/><text x="42" y="16" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" fill="#3A3632">vector search</text></g>
</g>

<!-- right: stack of index cards -->
<g transform="translate(720,88)">
  <!-- back cards -->
  <rect x="18" y="18" width="360" height="118" rx="6" fill="#F7EFE2" stroke="#E8DDD0" transform="rotate(1.2)"/>
  <rect x="8" y="8" width="360" height="118" rx="6" fill="#FFFFFF" stroke="#E8DDD0" transform="rotate(-0.6)"/>
  <!-- front card -->
  <rect width="360" height="118" rx="6" fill="#FFFFFF" stroke="#DDD1BE" stroke-width="1.2"/>
  <circle cx="346" cy="14" r="4" fill="#E8DDD0" stroke="#DDD1BE"/><circle cx="346" cy="14" r="1.3" fill="#FDF8F0"/>
  <text x="18" y="26" font-family="JetBrains Mono, monospace" font-size="8" letter-spacing="1.2" fill="#8D857B">[01] YOUTUBE MUSIC EXPLAINED — SCORE 5.39</text>
  <text x="18" y="48" font-family="Fraunces, Georgia, serif" font-size="13" font-weight="600" fill="#1A1816">YouTube Music Explained</text>
  <text x="18" y="64" font-family="JetBrains Mono, monospace" font-size="8.5" fill="#8D857B">youtube.com · score 5.39 · title 1.0 · url 1.0</text>
  <text x="18" y="86" font-family="Newsreader, Georgia, serif" font-size="11" fill="#3A3632">YouTube Music is a streaming service. Learn how</text>
  <text x="18" y="100" font-family="Newsreader, Georgia, serif" font-size="11" fill="#3A3632"><tspan fill="#1A1816" font-weight="600" style="background:#FFE9A8">youtube music</tspan> recommends songs...</text>
</g>
<g transform="translate(736,228)">
  <rect width="340" height="96" rx="6" fill="#FFFFFF" stroke="#E8DDD0"/>
  <text x="16" y="24" font-family="JetBrains Mono, monospace" font-size="8" letter-spacing="1.2" fill="#8D857B">[02] YOUTUBE CREATOR GUIDE — 5.28</text>
  <text x="16" y="44" font-family="Fraunces, Georgia, serif" font-size="12.5" font-weight="600" fill="#1A1816">YouTube Creator Guide</text>
  <text x="16" y="62" font-family="Newsreader, Georgia, serif" font-size="11" fill="#3A3632">YouTube is a video platform for creators...</text>
</g>
<g transform="translate(754,344)">
  <rect width="320" height="88" rx="6" fill="#FFFFFF" stroke="#E8DDD0" transform="rotate(0.7)"/>
  <text x="14" y="22" font-family="JetBrains Mono, monospace" font-size="8" letter-spacing="1.2" fill="#8D857B">[03] VECTOR SEARCH PRIMER</text>
  <text x="14" y="42" font-family="Fraunces, Georgia, serif" font-size="12" font-weight="600" fill="#1A1816">Vector Search Primer</text>
</g>
<!-- stamp -->
<g transform="translate(1020,400) rotate(-8)">
  <rect width="96" height="28" rx="3" fill="none" stroke="#C9320A" stroke-width="1.2" stroke-dasharray="3 2"/>
  <text x="48" y="18" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" font-weight="700" letter-spacing="1.5" fill="#C9320A">PRIVATE</text>
</g>
</svg>